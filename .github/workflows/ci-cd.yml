name: HealthQueue CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'
      - 'infra/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'
      - 'infra/**'
      - 'docs/**'

# No top-level permissions block — each job declares only what it needs,
# preventing any job from accidentally inheriting write access it doesn't require.

env:
  # index.docker.io is the canonical Docker Hub registry host Cosign expects.
  REGISTRY: index.docker.io
  IMAGE_NAME: tierrab/healthqueue-api

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 · test
# Run the pytest suite on Python 3.12.  Triggered on every push and PR.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: "1 · Test"
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout only; no token write needed

    steps:
      # v7.0.1: latest stable; v7 is the current major series with the most
      # recent runner compatibility fixes and security patches.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # v7.0.0: latest stable v7; retains the `cache: pip` shortcut and
      # Python 3.12 support needed here.
      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 · build-and-scan
# Build the Docker image locally (no push) then gate on Trivy finding any
# CRITICAL or HIGH CVE.  Triggered on every push and PR.
# ─────────────────────────────────────────────────────────────────────────────
  build-and-scan:
    name: "2 · Build & Scan"
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout only; image is never pushed in this job

    steps:
      # v7.0.1: consistent pin across all jobs.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # v4.4.1: latest stable v4; ships the current Buildx release and retains
      # the `type=gha` cache backend used to share layers across jobs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # v7.4.0: latest stable v7; outputs `digest` and `imageid`; supports the
      # `type=gha` cache exporter needed for cross-job layer reuse.
      - name: Build image (local only — no push)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true          # loads image into the runner's Docker daemon
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max   # write full layer cache for later jobs

      # v0.36.0: latest stable; note the required `v` prefix (bare `0.x.y` tags
      # do not exist in this repo).
      # ignore-unfixed: true skips Debian OS packages that have no upstream fix
      # available yet (e.g. python:3.12-slim carries ~44 HIGH CVEs with status
      # "affected" but no patched version released by Debian).  Blocking on
      # unfixed vulns gives no actionable remediation path — the only recourse
      # would be switching base images, not patching — while preventing all
      # merges.  A second non-blocking step below records the full picture for
      # audit and accepted-risk visibility without stopping the pipeline.
      - name: Scan with Trivy (block on fixable CRITICAL or HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      # Non-blocking full scan: all severities, unfixed included.  Runs even if
      # the step above failed (if: always()) so reviewers always get a report.
      - name: Scan with Trivy (full report — all severities, non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          output: trivy-full-report.txt
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: "0"
          vuln-type: os,library

      # v7.0.2: latest stable upload-artifact; uploads the full table so
      # the accepted unfixed vulns remain auditable without re-running the scan.
      # if: always() ensures the artifact is saved even when the blocking step
      # above found a fixable vulnerability and failed the job.
      - name: Upload full Trivy report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trivy-full-report
          path: trivy-full-report.txt
          retention-days: 30

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 · sbom
# Generate an SPDX JSON SBOM from the container image using Syft, then upload
# it as a workflow artifact so the sign job can attach it as an attestation.
# Triggered on every push and PR.
# ─────────────────────────────────────────────────────────────────────────────
  sbom:
    name: "3 · SBOM"
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read          # checkout only

    steps:
      # v7.0.1: consistent pin across all jobs.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # v4.4.1: needed to restore the GHA build cache from job 2.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # v7.4.0: restores layers from GHA cache so the rebuild is near-instant.
      # No `cache-to` here — we only read the cache, never overwrite it mid-run.
      - name: Build image (for SBOM scan)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:sbom
          cache-from: type=gha

      # v0.24.3: latest stable; bundles Syft 1.x engine; supports SPDX JSON
      # output natively.  Setting `artifact-name` causes the action to upload
      # the file as a workflow artifact automatically via @actions/artifact —
      # no separate upload-artifact step required.
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}:sbom
          format: spdx-json
          output-file: healthqueue-sbom.spdx.json
          artifact-name: healthqueue-sbom.spdx.json

# ─────────────────────────────────────────────────────────────────────────────
# Job 4 · push
# Build the final image and push it to Docker Hub tagged with the short commit
# SHA and `latest`.  Runs on pushes to main only — skipped on PRs.
# ─────────────────────────────────────────────────────────────────────────────
  push:
    name: "4 · Push to Docker Hub"
    needs: sbom
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read          # Docker Hub credentials come from secrets, not GITHUB_TOKEN
    outputs:
      digest: ${{ steps.push.outputs.digest }}   # sha256:... passed to the sign job

    steps:
      # v7.0.1: consistent pin.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # v4.4.1: Buildx needed for GHA cache restore and multi-platform capability.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # v4.6.0: latest stable v4; stores credentials in the runner's Docker
      # config.json rather than an env var, keeping the token out of the
      # process environment.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve short commit SHA
        id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # v7.4.0: `push: true` ships the image to Docker Hub and emits `digest`
      # (sha256:...) as an output, which the sign job uses to reference the
      # exact immutable image rather than a mutable tag.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────────────────────
# Job 5 · sign
# 1. Cosign keyless-signs the image digest using GitHub OIDC (no long-lived key).
# 2. Attaches the SBOM from job 3 as a Cosign attestation on the same digest.
# 3. Generates SLSA Build Level 2 provenance via actions/attest-build-provenance.
# Runs on pushes to main only — skipped on PRs.
# ─────────────────────────────────────────────────────────────────────────────
  sign:
    name: "5 · Sign & Attest"
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Cosign keyless: runner exchanges this for a Fulcio CA cert
      attestations: write  # actions/attest-build-provenance: write to GH attestation store

    steps:
      # v7.0.1: consistent pin.
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # v4.1.2: latest stable v4; pins the current Cosign 2.x binary; v4 is
      # the current major series with up-to-date Sigstore library versions.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      # v4.6.0: re-authenticate so this job can push the Cosign signature
      # bundle and the SBOM attestation back to Docker Hub.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Keyless signing: Cosign obtains an ephemeral signing key, requests a
      # short-lived certificate from Fulcio (bound to this workflow's OIDC
      # identity), signs the digest, and records the entry in Rekor (public
      # transparency log).  No long-lived private key is stored anywhere.
      - name: Sign image digest with Cosign (keyless / GitHub OIDC)
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      # v8.0.2: latest stable v8; must match the major version used internally
      # by anchore/sbom-action when it uploaded the artifact, to avoid artifact
      # format incompatibility across major versions.
      - name: Download SBOM artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: healthqueue-sbom.spdx.json
          path: .

      # Attaches the SPDX SBOM as an in-toto attestation on the same digest
      # that was signed above, making it verifiable alongside the signature.
      - name: Attach SBOM as Cosign attestation
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate healthqueue-sbom.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      # v4.2.2: latest stable v4; generates a SLSA Build Level 2 provenance
      # statement describing this workflow run and uploads it both to the GitHub
      # attestation store and (via push-to-registry) to Docker Hub as an OCI
      # referrer, so `cosign verify-attestation` can retrieve it.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.push.outputs.digest }}
          push-to-registry: true
